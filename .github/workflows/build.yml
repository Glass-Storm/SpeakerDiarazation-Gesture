name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `:app` consumes com.glassstorm.phonemanager:contract:1.1.0 from MAVEN LOCAL
      # (the hub publishes it with :contract:publishToMavenLocal; it is on no remote
      # repository). Publish it from a hub checkout, and give the hub its pinned
      # ai-android composite build + the gitignored sherpa-onnx AAR.
      - name: Set up JDK 21 (hub contract)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish the hub contract to Maven local
        run: |
          HUB="${{ github.workspace }}/../hub"
          ENGINE="${{ github.workspace }}/../../ai-android"
          git clone --depth 1 https://github.com/Glass-Storm/phone-manager.git "$HUB"
          git clone --depth 1 https://github.com/Glass-Storm/ai-android.git "$ENGINE"
          git -C "$ENGINE" checkout --detach c0644eada44c242604e07546ff93aef80d9563f8
          bash "$ENGINE/scripts/fetch-sherpa-aar.sh"
          cd "$HUB" && ./gradlew :contract:publishToMavenLocal

      - name: Set up JDK 17 (glasses app)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lint --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
