name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The github.com release-download edge intermittently answers 504, and it is
      # the redirect target for both services.gradle.org and some Maven Central
      # jars. Seed the pinned Gradle 8.13 distribution through the GitHub API so
      # neither `./gradlew` nor `gradle/actions/setup-gradle` fetches it.
      - name: Seed the pinned Gradle distribution from the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="8.13"
          url="https://services.gradle.org/distributions/gradle-${version}-bin.zip"
          hash=$(python3 -c '
          import hashlib, sys
          n = int.from_bytes(hashlib.md5(sys.argv[1].encode()).digest(), "big")
          digits = "0123456789abcdefghijklmnopqrstuvwxyz"
          out = ""
          while n:
              out = digits[n % 36] + out
              n //= 36
          print(out or "0")
          ' "$url")
          dist="$HOME/.gradle/wrapper/dists/gradle-${version}-bin/${hash}"
          mkdir -p "$dist"
          if [ ! -f "$dist/gradle-${version}-bin.zip.ok" ]; then
            asset_id=$(gh api "repos/gradle/gradle-distributions/releases/tags/v${version}.0" \
              --jq ".assets[] | select(.name == \"gradle-${version}-bin.zip\") | .id")
            test -n "$asset_id"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "$dist/gradle-${version}-bin.zip" \
              "https://api.github.com/repos/gradle/gradle-distributions/releases/assets/$asset_id"
            unzip -q "$dist/gradle-${version}-bin.zip" -d "$dist"
            touch "$dist/gradle-${version}-bin.zip.ok"
          fi

      # The Gradle Plugin Portal (and, on affected edges, Maven Central) redirects
      # the large `kotlin-compiler-embeddable` jars to github.com release downloads.
      # Fetch them through the GitHub API into a local Maven repository that wins
      # for the org.jetbrains.kotlin group, and take the small POMs from Maven
      # Central. Both compiler versions in play are cached: 2.0.21 (the Kotlin DSL
      # in the hub's build-logic) and 2.1.0 (the projects' Kotlin plugin).
      - name: Prefetch the Kotlin compiler jars via the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          PREFETCH_MAVEN_REPO: ${{ runner.temp }}/prefetch-repo
        run: |
          set -euo pipefail
          echo "PREFETCH_MAVEN_REPO=$PREFETCH_MAVEN_REPO" >> "$GITHUB_ENV"
          for version in 2.0.21 2.1.0; do
            dir="$PREFETCH_MAVEN_REPO/org/jetbrains/kotlin/kotlin-compiler-embeddable/$version"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/kotlin-compiler-embeddable-${version}.pom" \
              "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/${version}/kotlin-compiler-embeddable-${version}.pom" \
              || curl -fsSL -o "$dir/kotlin-compiler-embeddable-${version}.pom" \
              "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/${version}/kotlin-compiler-embeddable-${version}.pom"
            asset_id=$(gh api "repos/JetBrains/kotlin/releases/tags/v${version}" \
              --jq ".assets[] | select(.name == \"kotlin-compiler-embeddable-${version}.jar\") | .id")
            test -n "$asset_id"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "$dir/kotlin-compiler-embeddable-${version}.jar" \
              "https://api.github.com/repos/JetBrains/kotlin/releases/assets/$asset_id"
          done

      - name: Resolve the Kotlin toolchain from the prefetched repository
        run: |
          cat > "$RUNNER_TEMP/prefetch-kotlin.gradle" <<'EOF'
          def prefetch = new File(System.getenv("PREFETCH_MAVEN_REPO")).toURI()
          gradle.beforeSettings { settings ->
              def repos = settings.pluginManagement.repositories
              repos.clear()
              repos.maven {
                  url = prefetch
                  content { includeGroupByRegex("org\\.jetbrains\\.kotlin.*") }
              }
              repos.google()
              repos.mavenCentral()
              repos.gradlePluginPortal()
          }
          gradle.settingsEvaluated { settings ->
              def repos = settings.dependencyResolutionManagement.repositories
              def repo = repos.maven {
                  url = prefetch
                  content { includeGroupByRegex("org\\.jetbrains\\.kotlin.*") }
              }
              repos.remove(repo)
              repos.add(0, repo)
          }
          EOF

      # `:app` consumes com.glassstorm.phonemanager:contract:1.1.0 from MAVEN LOCAL
      # (the hub publishes it with :contract:publishToMavenLocal; it is on no remote
      # repository). Publish it from a hub checkout, and give the hub its pinned
      # ai-android composite build + the gitignored sherpa-onnx AAR.
      - name: Set up JDK 21 (hub contract)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish the hub contract to Maven local
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HUB="${{ github.workspace }}/../hub"
          ENGINE="${{ github.workspace }}/../../ai-android"
          INIT="$RUNNER_TEMP/prefetch-kotlin.gradle"
          git clone --depth 1 https://github.com/Glass-Storm/phone-manager.git "$HUB"
          git clone --depth 1 https://github.com/Glass-Storm/ai-android.git "$ENGINE"
          git -C "$ENGINE" checkout --detach c0644eada44c242604e07546ff93aef80d9563f8

          # The pinned AAR is SHA-256 verified by the ai-android script. The
          # github.com release-download edge intermittently returns 504, so fall
          # back to the GitHub API asset endpoint; the script's SHA-256 check still
          # gates whatever lands in libs/.
          if ! bash "$ENGINE/scripts/fetch-sherpa-aar.sh"; then
            AAR_NAME="sherpa-onnx-1.13.8.aar"
            mkdir -p "$ENGINE/libs"
            ASSET_ID=$(gh api repos/k2-fsa/sherpa-onnx/releases/tags/v1.13.8 \
              --jq ".assets[] | select(.name == \"$AAR_NAME\") | .id")
            test -n "$ASSET_ID"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "$ENGINE/libs/$AAR_NAME" \
              "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/assets/$ASSET_ID"
            bash "$ENGINE/scripts/fetch-sherpa-aar.sh"
          fi

          # The Gradle distribution is seeded above, but keep the retry so a
          # transient dependency-download failure does not fail the release.
          for attempt in 1 2 3; do
            if (cd "$HUB" && ./gradlew :contract:publishToMavenLocal --init-script "$INIT"); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "hub contract publish attempt $attempt failed; retrying"
            sleep 10
          done

      - name: Set up JDK 17 (glasses app)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --init-script "$RUNNER_TEMP/prefetch-kotlin.gradle"
        env:
          GIT_TAG: ${{ github.ref_name }}

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SpeakerDiarazation-Gesture ${{ github.ref_name }}
          body: |
            Smart-glasses Android app (`DEVICE_ROLE_GLASS`), built from tag
            `${{ github.ref_name }}`. It streams audio and video to the phone hub and
            renders the transcripts the hub returns.

            ## Asset

            `app-debug.apk` is debug-signed and installable:

            ```bash
            adb install -r app-debug.apk
            ```

            ## Flows

            - **DEAF mode**: tap **開始錄音** to start streaming to the hub. Set the hub
              host to `10.240.85.29` (the phone hub's hotspot address, gRPC port `9000`).
            - **HEARING mode**: use the gesture flow to send camera frames to the hub and
              receive gesture results on the same stream.

            ## Companion releases

            - Phone hub: `v1.0.0`
            - Raspberry Pi necklace daemon: `v0.1.0`

            The three-end demo is hub (phone) + glasses (DEAF/HEARING, this app) + Pi necklace.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
