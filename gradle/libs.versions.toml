[versions]
agp = "8.13.0"
kotlin = "2.1.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.6.1"
material = "1.10.0"
activity = "1.11.0"
constraintlayout = "2.1.4"

# The hub's `ecosys.v1` contract artifact and its LITE runtime. These pins MUST
# match the hub's `gradle/libs.versions.toml` (`protoc`, `protobufJavaLite`/
# `protobufKotlinLite`, `grpc`, `grpcKotlin`) so the generated bindings link
# against the same protobuf-lite. Do NOT swap any of these for the full
# `protobuf-java` / `grpc-protobuf`: `:contract` is generated in `lite` mode.
ecosysContract = "1.1.0"
protobufLite = "3.25.9"
grpc = "1.84.0"
grpcKotlin = "1.5.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# `ecosys.v1` contract + its protobuf-LITE / gRPC runtime, matching the hub.
ecosys-contract = { group = "com.glassstorm.phonemanager", name = "contract", version.ref = "ecosysContract" }
grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpc" }
grpc-protobuf-lite = { group = "io.grpc", name = "grpc-protobuf-lite", version.ref = "grpc" }
grpc-kotlin-stub = { group = "io.grpc", name = "grpc-kotlin-stub", version.ref = "grpcKotlin" }
# In-process transport: lets a plain JVM unit test stand up a real gRPC server
# in the same process (no socket, no device) to round-trip an ecosys.v1 frame.
grpc-inprocess = { group = "io.grpc", name = "grpc-inprocess", version.ref = "grpc" }
# Production transport for the real client. `ManagedChannelBuilder.forAddress`
# resolves a `ManagedChannelProvider` through ServiceLoader, so without a
# transport artifact on the runtime classpath the shipped APK throws
# `ProviderNotFoundException` the moment it dials the hub. `grpc-okhttp` is the
# standard Android/JVM transport (okhttp-backed, no netty/native deps) and is
# pinned to the same `grpc` version as the rest of the runtime.
grpc-okhttp = { group = "io.grpc", name = "grpc-okhttp", version.ref = "grpc" }
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobufLite" }
protobuf-kotlin-lite = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobufLite" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
